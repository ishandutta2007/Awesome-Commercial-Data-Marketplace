<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Glowing Accents -->
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: url(#textGrad); }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #f8fafc; }
    
    /* Animations */
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-1deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .animated-card-1 { animation: float1 6s ease-in-out infinite; }
    .animated-card-2 { animation: float2 7s ease-in-out infinite; }
    .pulse { animation: pulseGlow 4s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 8, 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>
  <rect width="1200" height="400" fill="url(#glow1)" class="pulse"/>
  <rect width="1200" height="400" fill="url(#glow2)" class="pulse"/>

  <!-- Dynamic / Decorative Background Graphic Elements (Kept in Background/Sides) -->
  <g class="animated-card-1" opacity="0.6">
    <!-- Financial Graph Line -->
    <path d="M 50 320 Q 150 260 250 290 T 450 210 T 650 240 T 850 150 T 1150 180" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
    <path d="M 50 320 Q 150 260 250 290 T 450 210 T 650 240 T 850 150 T 1150 180" fill="none" stroke="#818cf8" stroke-width="2" class="flow-line" opacity="0.6"/>
  </g>

  <!-- Decorative Abstract Pill Badges on Outer Edges -->
  <g class="animated-card-2">
    <rect x="920" y="60" width="220" height="48" rx="24" fill="url(#cardGrad)" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="945" cy="84" r="8" fill="#38bdf8"/>
    <text x="965" y="89" class="badge-text">Snowflake &amp; AWS</text>

    <rect x="950" y="280" width="200" height="48" rx="24" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="975" cy="304" r="8" fill="#ec4899"/>
    <text x="995" y="309" class="badge-text">Data Clean Rooms</text>

    <rect x="50" y="60" width="210" height="48" rx="24" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="75" cy="84" r="8" fill="#22c55e"/>
    <text x="95" y="89" class="badge-text">Open-Source OS</text>
  </g>

  <!-- Foreground Main Content Container (Guaranteed Clear & Visible) -->
  <g transform="translate(600, 200)" text-anchor="middle">
    <!-- Category Tag -->
    <rect x="-140" y="-125" width="280" height="32" rx="16" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-opacity="0.4"/>
    <text x="0" y="-104" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#a5b4fc" letter-spacing="2">CURATED ECOSYSTEM DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="-35" class="title" text-anchor="middle">Awesome Commercial Data Marketplace</text>
    
    <!-- Subtitle -->
    <text x="0" y="25" class="subtitle" text-anchor="middle">Discover Data Exchanges, Monetization Frameworks &amp; Clean Rooms</text>

    <!-- Stat Badges / Highlights -->
    <g transform="translate(0, 75)">
      <!-- Pill 1 -->
      <g transform="translate(-230, 0)">
        <rect x="0" y="0" width="140" height="36" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
        <text x="70" y="23" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1" font-weight="600" text-anchor="middle">📊 Enterprise SaaS</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-70, 0)">
        <rect x="0" y="0" width="140" height="36" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
        <text x="70" y="23" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1" font-weight="600" text-anchor="middle">🔓 Open-Source</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(90, 0)">
        <rect x="0" y="0" width="140" height="36" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
        <text x="70" y="23" font-family="'Segoe UI', sans-serif" font-weight="600" fill="#cbd5e1" text-anchor="middle">🔒 Clean Rooms</text>
      </g>
    </g>
  </g>
</svg>
